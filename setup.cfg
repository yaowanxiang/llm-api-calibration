[metadata]
name = llm-api-calibration
version = 0.1.0
description = 统一API与订阅版的体验差异 - 解决API降智问题的通用方案
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/yaowanxiang/llm-api-calibration
author = yaowanxiang
author_email = yaowanxiang@qut.edu.cn
license = MIT
license_files = LICENSE
license_expression = MIT

[options]
python_requires = >=3.8
zip_safe = False
include_package_data = True
packages = find:
packages = llm_api_calibration

install_requires =
    anthropic>=0.7.0
    requests>=2.28.0

[options.packages.find]
where = .
exclude =
    tests
    docs
    examples
    build
    dist

[options.extras_require]
dev =
    pytest>=7.0.0
    pytest-cov>=4.0.0
    pytest-asyncio>=0.21.0
    flake8>=6.0.0
    black>=23.0.0
    isort>=5.12.0
    mypy>=1.0.0
    pre-commit>=3.0.0

docs =
    sphinx>=5.0.0
    sphinx-rtd-theme>=1.0.0
    myst-parser>=0.18.0
    sphinx-autodoc-typehints>=1.19.0

search =
    duckduckgo-search>=3.9.0

docs-parse =
    PyPDF2>=3.0.0
    python-docx>=0.8.11

all =
    llm-api-calibration[dev,docs,search,docs-parse]

[options.entry_points]
console_scripts =
    llm-calibrate = llm_api_calibration.cli:main

[options.classifiers]
Development Status :: 3 - Alpha
Intended Audience :: Developers
Intended Audience :: Science/Research
License :: OSI Approved :: MIT License
Operating System :: OS Independent
Programming Language :: Python :: 3
Programming Language :: Python :: 3.8
Programming Language :: Python :: 3.9
Programming Language :: Python :: 3.10
Programming Language :: Python :: 3.11
Programming Language :: Python :: 3.12
Topic :: Scientific/Engineering :: Artificial Intelligence
Topic :: Software Development :: Libraries :: Python Modules

[flake8]
max-line-length = 100
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .venv,
    venv,

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers --strict-config

[coverage:run]
source = llm_api_calibration
omit = tests/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError